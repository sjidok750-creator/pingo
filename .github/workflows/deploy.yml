name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/new-app-project-0fxBY
      - claude/pingo-project-fzQzK
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npx expo export --platform web

      - name: Fix asset paths
        run: |
          # index.html: relative paths so the page works under /pingo/
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          # bundle: rewrite hard-coded absolute "/assets/..." (used by
          # @expo/vector-icons font URLs) to "/pingo/assets/..." so they
          # resolve correctly under the GitHub Pages subpath.
          find dist/_expo -type f -name '*.js' -exec sed -i 's|"/assets/|"/pingo/assets/|g' {} +
          touch dist/.nojekyll

      - name: Add PWA manifest and Android/iOS install icons
        run: |
          mkdir -p dist/assets/pwa
          cp assets/pwa/*.png dist/assets/pwa/
          cp scripts/manifest.json dist/manifest.json
          # Inject manifest + apple-touch-icon + theme-color into index.html
          python3 -c "
          import re, pathlib
          p = pathlib.Path('dist/index.html')
          s = p.read_text()
          tags = (
            '<link rel=\"manifest\" href=\"./manifest.json\">'
            '<link rel=\"apple-touch-icon\" href=\"./assets/pwa/apple-touch-icon.png\">'
            '<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">'
            '<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">'
            '<meta name=\"apple-mobile-web-app-title\" content=\"Pingo\">'
            '<meta name=\"theme-color\" content=\"#1B1916\">'
          )
          s = s.replace('</head>', tags + '</head>', 1)
          p.write_text(s)
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
